services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    ports: ["80:4000"]
    env_file: .env          # copy .env.example to .env and fill it in
    environment:
      MONGODB_URI: mongodb://mongo:27017/campus_hub   # overrides .env: use the bundled MongoDB container
    volumes:
      - campus-data:/data   # uploaded files
volumes:
  campus-data:
  mongo-data:
